<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- PHASE 2: build the page here.

       Your backend (Phase 1) is already running with real data in it,
       so build this page straight against the API - there is no
       in-memory or localStorage stage this time.

       1. Navbar
       2. Summary cards: total amount, number of expenses, highest expense
       3. Form to add an expense: title, amount, category (select), date
       4. Filter by category (with an "All" option)
       5. Table: title, amount, category, date, an edit button, a delete button

       Remember: the table rows must be built with JavaScript (DOM),
       not written by hand in this file. -->
  <!-- ====================================================== -->
  <!-- PHASE 2 -->
  <!-- ====================================================== -->


  <!-- ====================================================== -->
  <!-- 1. NAVBAR -->
  <!-- ====================================================== -->

  <nav class="navbar navbar-dark bg-dark">

    <div class="container">

      <span class="navbar-brand mb-0 h1">
        Expense Tracker
      </span>

    </div>

  </nav>



  <!-- ====================================================== -->
  <!-- MAIN CONTENT -->
  <!-- ====================================================== -->

  <main class="container mt-4">


    <!-- ====================================================== -->
    <!-- ALERT CONTAINER -->
    <!-- JavaScript will put success/error messages here -->
    <!-- ====================================================== -->

    <div id="alertContainer" class="mb-3"></div>



    <!-- ====================================================== -->
    <!-- SUMMARY CARDS - CSS GRID -->
    <!-- ====================================================== -->

    <div class="summary-grid mb-4">

      <!-- Total Amount -->
      <div class="card shadow-sm">

        <div class="card-body">

          <h5 class="card-title">
            Total Amount
          </h5>

          <p id="totalAmount" class="card-text fs-4">
            0.00
          </p>

        </div>

      </div>


      <!-- Number of Expenses -->
      <div class="card shadow-sm">

        <div class="card-body">

          <h5 class="card-title">
            Number of Expenses
          </h5>

          <p id="expenseCount" class="card-text fs-4">
            0
          </p>

        </div>

      </div>


      <!-- Highest Expense -->
      <div class="card shadow-sm">

        <div class="card-body">

          <h5 class="card-title">
            Highest Expense
          </h5>

          <p id="highestExpense" class="card-text fs-4">
            0.00
          </p>

        </div>

      </div>

    </div>



    <!-- ====================================================== -->
    <!-- 3. ADD EXPENSE FORM -->
    <!-- ====================================================== -->

    <div class="card shadow-sm mb-4">

      <div class="card-body">


        <h4 class="mb-3">
          Add Expense
        </h4>


        <form id="expenseForm">


          <div class="row g-3">


            <!-- Title -->

            <div class="col-md-6">

              <label for="title" class="form-label">
                Title
              </label>

              <input type="text" class="form-control" id="title" placeholder="Enter expense title" required>

            </div>



            <!-- Amount -->

            <div class="col-md-6">

              <label for="amount" class="form-label">
                Amount
              </label>

              <input type="number" class="form-control" id="amount" placeholder="Enter amount" min="0.01" step="0.01"
                required>

            </div>



            <!-- Category -->

            <div class="col-md-6">

              <label for="category" class="form-label">
                Category
              </label>

              <select class="form-select" id="category" required>

                <option value="">
                  Choose category
                </option>

                <option value="Food">
                  Food
                </option>

                <option value="Transport">
                  Transport
                </option>

                <option value="Bills">
                  Bills
                </option>

                <option value="Entertainment">
                  Entertainment
                </option>

                <option value="Other">
                  Other
                </option>

              </select>

            </div>



            <!-- Date -->

            <div class="col-md-6">

              <label for="date" class="form-label">
                Date
              </label>

              <input type="date" class="form-control" id="date" required>

            </div>


          </div>



          <!-- Add Button -->

          <button type="submit" class="btn btn-primary mt-3">
            Add Expense
          </button>


        </form>


      </div>

    </div>



    <!-- ====================================================== -->
    <!-- FILTERS + SEARCH + EXPORT -->
    <!-- ====================================================== -->

    <div class="card shadow-sm mb-4">

      <div class="card-body">

        <h4 class="mb-3">
          Filters
        </h4>

        <div class="row g-3 align-items-end">


          <!-- Category Filter -->

          <div class="col-md-3">

            <label for="categoryFilter" class="form-label">
              Category
            </label>

            <select id="categoryFilter" class="form-select">

              <option value="All">All</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>

            </select>

          </div>


          <!-- Month Filter -->

          <div class="col-md-3">

            <label for="monthFilter" class="form-label">
              Month
            </label>

            <input type="month" id="monthFilter" class="form-control">

          </div>


          <!-- Search by Title -->

          <div class="col-md-3">

            <label for="searchInput" class="form-label">
              Search by Title
            </label>

            <input type="text" id="searchInput" class="form-control" placeholder="Search...">

          </div>


          <!-- Export + Clear -->

          <div class="col-md-3">

            <div class="d-flex gap-2">

              <button id="clearFiltersButton" class="btn btn-secondary flex-fill" type="button">
                Clear Filters
              </button>

              <button id="exportCsvButton" class="btn btn-success flex-fill" type="button">
                Export CSV
              </button>



            </div>


          </div>

        </div>

      </div>


      <!-- ====================================================== -->
      <!-- 5. EXPENSE TABLE -->
      <!-- ====================================================== -->

      <div class="card shadow-sm">

        <div class="card-body">


          <h4 class="mb-3">
            Expenses
          </h4>



          <!-- ================================================== -->
          <!-- LOADING SPINNER -->
          <!-- ================================================== -->

          <div id="loadingSpinner" class="text-center my-4 d-none">

            <div class="spinner-border" role="status">

              <span class="visually-hidden">
                Loading...
              </span>

            </div>

          </div>



          <!-- ================================================== -->
          <!-- TABLE -->
          <!-- ================================================== -->

          <div class="table-responsive">


            <table class="table table-striped table-hover ">


              <thead>

                <tr>

                  <th>Title</th>

                  <th>Amount</th>

                  <th>Category</th>

                  <th>Date</th>

                  <th>Actions</th>

                </tr>

              </thead>



              <!--
              IMPORTANT:
              Do not manually write expense rows here.

              JavaScript will receive the expenses
              from the backend and create the rows.
            -->

              <tbody id="expensesTableBody">

              </tbody>


            </table>


          </div>


        </div>

      </div>


  </main>



  <!-- ====================================================== -->
  <!-- EDIT EXPENSE MODAL -->
  <!-- We will use this later for PUT -->
  <!-- ====================================================== -->

  <div class="modal fade" id="editExpenseModal" tabindex="-1" aria-hidden="true">

    <div class="modal-dialog">

      <div class="modal-content">


        <!-- Modal Header -->

        <div class="modal-header">

          <h5 class="modal-title">
            Edit Expense
          </h5>

          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>

        </div>



        <!-- Modal Body -->

        <div class="modal-body">


          <form id="editExpenseForm">


            <!-- Store expense ID -->

            <input type="hidden" id="editExpenseId">



            <!-- Edit Title -->

            <div class="mb-3">

              <label for="editTitle" class="form-label">
                Title
              </label>

              <input type="text" class="form-control" id="editTitle" required>

            </div>



            <!-- Edit Amount -->

            <div class="mb-3">

              <label for="editAmount" class="form-label">
                Amount
              </label>

              <input type="number" class="form-control" id="editAmount" min="0.01" step="0.01" required>

            </div>



            <!-- Edit Category -->

            <div class="mb-3">

              <label for="editCategory" class="form-label">
                Category
              </label>

              <select class="form-select" id="editCategory" required>

                <option value="Food">
                  Food
                </option>

                <option value="Transport">
                  Transport
                </option>

                <option value="Bills">
                  Bills
                </option>

                <option value="Entertainment">
                  Entertainment
                </option>

                <option value="Other">
                  Other
                </option>

              </select>

            </div>



            <!-- Edit Date -->

            <div class="mb-3">

              <label for="editDate" class="form-label">
                Date
              </label>

              <input type="date" class="form-control" id="editDate" required>

            </div>


          </form>


        </div>



        <!-- Modal Footer -->

        <div class="modal-footer">

          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Cancel
          </button>


          <button type="submit" form="editExpenseForm" class="btn btn-primary">
            Save Changes
          </button>

        </div>


      </div>

    </div>

  </div>







  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
